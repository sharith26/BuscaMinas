<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscaminas</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="game-header">
    <h1>Buscaminas</h1>
    <p class="subtitle">Descubre todas las casillas sin pisar una mina. Cada número indica cuántas minas hay en las casillas vecinas.</p>
  </header>

  <div class="window">

    <div class="toolbar">
      <button class="tool-btn" title="Acercar">🔍<span class="zoom-sign">+</span></button>
      <button class="tool-btn" title="Alejar">🔍<span class="zoom-sign">−</span></button>
      <button class="tool-btn" title="Favorito">⭐</button>
      <button class="tool-btn" title="Marcar">🚩</button>
      <button class="tool-btn" title="Jugadores">👤<span class="badge-mini blue">1</span></button>
      <button class="tool-btn" title="Jugadores">👤<span class="badge-mini red">2</span></button>
      <button class="tool-btn" title="Ayuda">❓</button>
      <button class="tool-btn" title="Confirmar">✔️</button>
    </div>

    <div class="top-frame">
      <div class="counter">0&nbsp;1&nbsp;0</div>
      <button class="smiley-btn" title="Reiniciar">&#9785;</button>
      <div class="counter">0&nbsp;0&nbsp;8</div>
    </div>

    <div class="board-frame">
      <div class="board">
      <div class="row">
        <span class="cell revealed"></span>
        <span class="cell revealed"></span>
        <span class="cell revealed"></span>
        <span class="cell revealed"></span>
        <span class="cell revealed num-1">1</span>
        <span class="cell hidden"></span>
        <span class="cell hidden"></span>
        <span class="cell revealed mine-hit"><span class="mine-icon"><span></span></span></span>
        <span class="cell hidden"></span>
      </div>
      <div class="row">
        <span class="cell revealed"></span>
        <span class="cell revealed"></span>
        <span class="cell revealed"></span>
        <span class="cell revealed num-1">1</span>
        <span class="cell revealed num-1">1</span>
        <span class="cell hidden"></span>
        <span class="cell revealed"><span class="mine-icon"><span></span></span></span>
        <span class="cell hidden"></span>
        <span class="cell hidden"></span>
      </div>
      <div class="row">
        <span class="cell revealed num-1">1</span>
        <span class="cell revealed num-1">1</span>
        <span class="cell revealed num-1">1</span>
        <span class="cell revealed num-1">1</span>
        <span class="cell revealed num-1">1</span>
        <span class="cell revealed num-2">2</span>
        <span class="cell revealed"><span class="mine-icon"><span></span></span></span>
        <span class="cell hidden"></span>
        <span class="cell hidden"></span>
      </div>
      <div class="row">
        <span class="cell hidden"></span>
        <span class="cell revealed"><span class="mine-icon"><span></span></span></span>
        <span class="cell revealed num-1">1</span>
        <span class="cell revealed num-1">1</span>
        <span class="cell revealed num-2">2</span>
        <span class="cell hidden"></span>
        <span class="cell revealed"><span class="mine-icon"><span></span></span></span>
        <span class="cell hidden"></span>
        <span class="cell hidden"></span>
      </div>
      <div class="row">
        <span class="cell revealed num-1">1</span>
        <span class="cell revealed num-1">1</span>
        <span class="cell revealed num-1">1</span>
        <span class="cell hidden"></span>
        <span class="cell revealed num-2">2</span>
        <span class="cell revealed"><span class="mine-icon"><span></span></span></span>
        <span class="cell hidden"></span>
        <span class="cell hidden"></span>
        <span class="cell hidden"></span>
      </div>
      <div class="row">
        <span class="cell revealed"></span>
        <span class="cell revealed"></span>
        <span class="cell revealed num-1">1</span>
        <span class="cell revealed num-1">1</span>
        <span class="cell revealed num-2">2</span>
        <span class="cell revealed"><span class="mine-icon"><span></span></span></span>
        <span class="cell hidden"></span>
        <span class="cell hidden"></span>
        <span class="cell hidden"></span>
      </div>
      <div class="row">
        <span class="cell revealed"></span>
        <span class="cell revealed"></span>
        <span class="cell revealed"></span>
        <span class="cell revealed num-1">1</span>
        <span class="cell revealed num-1">1</span>
        <span class="cell hidden"></span>
        <span class="cell hidden"></span>
        <span class="cell hidden"></span>
        <span class="cell hidden"></span>
      </div>
      <div class="row">
        <span class="cell revealed"></span>
        <span class="cell revealed"></span>
        <span class="cell revealed"></span>
        <span class="cell revealed num-1">1</span>
        <span class="cell revealed num-1">1</span>
        <span class="cell hidden"></span>
        <span class="cell hidden"></span>
        <span class="cell hidden"></span>
        <span class="cell hidden"></span>
      </div>
      </div>
    </div>

  </div>

</body>
</html>
